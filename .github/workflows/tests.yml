name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: pip install starlette "uvicorn[standard]" httpx python-multipart pytest
      - name: Run tests (gateway, Python SDK, JS SDK, eval harness, fine-tuning data)
        run: pytest tests -q
