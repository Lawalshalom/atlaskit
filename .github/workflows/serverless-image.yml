name: serverless-image

# Builds the RunPod Serverless image (deploy/runpod/serverless/Dockerfile) and publishes it to
# ghcr.io/lawalshalom/atlaskit-serverless with the tags `latest` and the commit SHA.
on:
  push:
    branches: [main]
    paths: ["gateway/**", "playground/**", "deploy/runpod/serverless/**", ".github/workflows/serverless-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: serverless-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space for the 10 GB vLLM base image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/runpod/serverless/Dockerfile
          push: true
          tags: |
            ghcr.io/lawalshalom/atlaskit-serverless:latest
            ghcr.io/lawalshalom/atlaskit-serverless:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Lawalshalom/atlaskit
